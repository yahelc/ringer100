* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--surface);
  color: var(--text-primary);
  display: flex;
  height: 100vh;
  overflow: hidden;
}

.sidebar {
  width: 272px;
  min-width: 272px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
}

.sidebar-header {
  padding: 20px 20px 0;
}

.logo {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 2px;
}

.logo-main {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.1;
  color: var(--text-primary);
}

.logo-sub {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 4px;
  line-height: 1.4;
}

.filter-section {
  padding: 16px 20px 0;
}

.filter-section:last-child {
  padding-bottom: 20px;
}

.filter-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.preset-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.preset-btn {
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 600;
  background: var(--filter-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  color: var(--text-secondary);
  transition: all 0.12s;
  font-family: inherit;
  white-space: nowrap;
}
.preset-btn:hover { border-color: var(--accent); color: var(--text-primary); }
.preset-btn.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.preset-btn.jalen {
  background: var(--jalen-btn-bg);
  color: var(--jalen-btn-text);
  border-color: var(--jalen-btn-bg);
}
.preset-btn.jalen.active {
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.3);
}

.draft-select {
  width: 100%;
  padding: 6px 8px;
  font-size: 12px;
  font-family: inherit;
  background: var(--filter-bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-secondary);
  cursor: pointer;
}
.draft-select:focus { border-color: var(--accent); outline: none; }

.search-input {
  width: 100%;
  padding: 8px 10px;
  background: var(--search-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  color: var(--text-primary);
  outline: none;
  transition: border-color 0.15s;
  font-family: inherit;
}
.search-input::placeholder { color: var(--text-muted); }
.search-input:focus { border-color: var(--accent); }

.search-results {
  max-height: 180px;
  overflow-y: auto;
  margin-top: 4px;
  scrollbar-width: thin;
  scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
}

.search-item {
  padding: 6px 10px;
  font-size: 13px;
  cursor: pointer;
  border-radius: 4px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--text-primary);
}
.search-item:hover { background: var(--highlight-bg); }
.search-item .pos {
  font-size: 11px;
  color: var(--text-muted);
}

.filter-group {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.filter-chip {
  padding: 4px 10px;
  font-size: 12px;
  background: var(--filter-bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  color: var(--text-secondary);
  transition: all 0.12s;
  font-family: inherit;
}
.filter-chip:hover { border-color: var(--accent); color: var(--text-primary); }
.filter-chip.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

.selected-players {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-top: 4px;
}

.selected-tag {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 8px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-primary);
  background: var(--tag-bg);
}

.selected-tag .swatch {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  flex-shrink: 0;
}

.selected-tag .remove {
  margin-left: auto;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 14px;
  line-height: 1;
  padding: 0 2px;
}
.selected-tag .remove:hover { color: var(--text-primary); }

.clear-btn {
  font-size: 11px;
  color: var(--accent);
  cursor: pointer;
  background: none;
  border: none;
  font-family: inherit;
  margin-top: 6px;
  padding: 2px 0;
}
.clear-btn:hover { text-decoration: underline; }

.divider {
  height: 1px;
  background: var(--border);
  margin: 12px 20px 0;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.chart-header {
  padding: 16px 24px 0;
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
}

.chart-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
}

.chart-subtitle {
  font-size: 13px;
  color: var(--text-muted);
}

.chart-area {
  flex: 1;
  padding: 8px 24px 16px;
  position: relative;
  min-height: 0;
}

.chart-area svg {
  width: 100%;
  height: 100%;
}

.tooltip {
  position: fixed;
  pointer-events: none;
  background: var(--tooltip-bg);
  border: 1px solid var(--tooltip-border);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 12px;
  box-shadow: 0 4px 16px var(--tooltip-shadow);
  z-index: 100;
  max-width: 280px;
  opacity: 0;
  transition: opacity 0.1s;
}
.tooltip.visible { opacity: 1; pointer-events: auto; }

.tooltip-date {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 0.03em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.tooltip-date a {
  color: var(--accent);
  text-decoration: none;
}
.tooltip-date a:hover { text-decoration: underline; }

.tooltip-filter-rank {
  font-weight: 400;
  color: var(--text-muted);
  font-size: 11px;
  margin-left: 2px;
}

.tooltip-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 2px 0;
}

.tooltip-swatch {
  width: 12px;
  height: 2px;
  border-radius: 1px;
  flex-shrink: 0;
}

.tooltip-name {
  color: var(--text-secondary);
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tooltip-rank {
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--text-primary);
}

.table-toggle {
  position: absolute;
  top: 16px;
  right: 24px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  background: none;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 10px;
  cursor: pointer;
  font-family: inherit;
  z-index: 10;
}
.table-toggle:hover { color: var(--text-primary); border-color: var(--text-muted); }

.table-view {
  display: none;
  flex: 1;
  overflow: auto;
  padding: 8px 24px 16px;
}
.table-view.visible { display: block; }
.table-view table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.table-view th {
  text-align: left;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 6px 8px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--surface);
}
.table-view td {
  padding: 5px 8px;
  border-bottom: 1px solid var(--border-light);
  color: var(--text-primary);
}
.table-view tr:hover td { background: var(--highlight-bg); }

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-muted);
  font-size: 14px;
  gap: 8px;
}
.empty-state .hint {
  font-size: 12px;
  color: var(--text-muted);
  opacity: 0.7;
}

@media (max-width: 700px) {
  body { flex-direction: column; }
  .sidebar { width: 100%; min-width: 100%; max-height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
  .chart-area { min-height: 300px; }
}
</style>

<div class="sidebar">
  <div class="sidebar-header">
    <div class="logo">The Ringer</div>
    <div class="logo-main">100</div>
    <div class="logo-sub">NBA player rankings tracked over time, from Dec 2022 to today.</div>
  </div>

  <div class="divider"></div>

  <div class="filter-section">
    <div class="filter-label">Presets</div>
    <div class="preset-grid">
      <button class="preset-btn jalen" id="jalenBtn" onclick="togglePreset('jalens')">The Jalens</button>
      <button class="preset-btn" id="maxBtn" onclick="togglePreset('max')">Max $</button>
      <button class="preset-btn" id="rookiesBtn" onclick="togglePreset('rookies')">Rookies</button>
      <button class="preset-btn" id="moversBtn" onclick="togglePreset('movers')">Movers</button>
    </div>
  </div>

  <div class="filter-section">
    <div class="filter-label">Tier</div>
    <div class="filter-group" id="tierFilters">
      <button class="filter-chip" onclick="toggleTier(10, this)">Top 10</button>
      <button class="filter-chip" onclick="toggleTier(25, this)">Top 25</button>
      <button class="filter-chip" onclick="toggleTier(50, this)">Top 50</button>
    </div>
  </div>

  <div class="filter-section">
    <div class="filter-label">Conference</div>
    <div class="filter-group" id="confFilters">
      <button class="filter-chip" onclick="toggleConference('east', this)">East</button>
      <button class="filter-chip" onclick="toggleConference('west', this)">West</button>
    </div>
  </div>

  <div class="filter-section">
    <div class="filter-label">Draft Class</div>
    <select class="draft-select" id="draftSelect" onchange="selectDraftClass(this.value)">
      <option value="">All classes</option>
    </select>
  </div>

  <div class="divider"></div>

  <div class="filter-section">
    <div class="filter-label">Search players</div>
    <input class="search-input" id="searchInput" type="text" placeholder="Type a name..." oninput="onSearch(this.value)">
    <div class="search-results" id="searchResults"></div>
  </div>

  <div class="filter-section">
    <div class="filter-label">Selected <button class="clear-btn" id="clearBtn" onclick="clearAll()" style="display:none">Clear all</button></div>
    <div class="selected-players" id="selectedPlayers">
      <div class="empty-hint" style="font-size:12px;color:var(--text-muted)">No players selected</div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="filter-section">
    <div class="filter-label">Position</div>
    <div class="filter-group" id="positionFilters"></div>
  </div>

  <div class="divider"></div>

  <div class="filter-section">
    <div class="filter-label">Team</div>
    <div class="filter-group" id="teamFilters"></div>
  </div>
</div>

<div class="main">
  <div class="chart-header">
    <span class="chart-title" id="chartTitle">Select players to chart</span>
    <span class="chart-subtitle" id="chartSubtitle">4 seasons of rankings data</span>
  </div>
  <button class="table-toggle" id="tableToggle" onclick="toggleTable()">Table view</button>
  <div class="chart-area" id="chartArea">
    <div class="empty-state" id="emptyState">
      <div>Select players or use filters to start</div>
      <div class="hint">Try the Jalens preset</div>
    </div>
    <svg id="chartSvg" style="display:none"></svg>
  </div>
  <div class="table-view" id="tableView"></div>
</div>

<div class="tooltip" id="tooltip">
  <div class="tooltip-date" id="tooltipDate"></div>
  <div id="tooltipRows"></div>
</div>

const SEASON_FIRST_DI = {};
DATA.dates.forEach((d, i) => {

});
const LATEST_SEASON = DATA.seasons[DATA.seasons.length - 1];

const ROOKIES = DATA.players.filter(p => {
  const firstDi = Math.min(...p.d.map(e => e[0]));
  const firstDate = DATA.dates[firstDi];
  const [y, m] = firstDate.split('-').map(Number);
  const firstSeason = m >= 10 ? `${y}-${String(y+1).slice(-2)}` : `${y-1}-${String(y).slice(-2)}`;
  return firstSeason === LATEST_SEASON;
}).map(p => p.n);

const MOVERS = DATA.players.map(p => {
  const ranks = p.d.map(e => e[1]);
  return { n: p.n, range: Math.max(...ranks) - Math.min(...ranks) };
}).filter(m => m.range > 0).sort((a, b) => b.range - a.range).slice(0, 8).map(m => m.n);

const SNAPSHOT_TS = ['20221214222520','20230120195414','20230330073422','20230413214212','20231206000517','20240215014418','20240518183526','20240527054616','20240819010352','20240916144559','20241112061602','20250128154605','20250327022818','20250404003329','20250524001339','20250620211439','20250724134715','20250806171427','20250901133647','20251005180313','20251215145256','20260111044941','20260226190849'];
const SNAP_DATES = SNAPSHOT_TS.map(ts => ({ d: `${ts.slice(0,4)}-${ts.slice(4,6)}-${ts.slice(6,8)}`, ts }));

function ringerLink(date) {
  const live = 'https://nbarankings.theringer.com/rankings';
  let best = null, bestDiff = Infinity;
  for (const s of SNAP_DATES) {
    const diff = Math.abs(new Date(date) - new Date(s.d));
    if (diff < bestDiff) { bestDiff = diff; best = s.ts; }
  }
  if (bestDiff < 7 * 86400000) return `https://web.archive.org/web/${best}/${live}`;
  return live;
}

function init() {
  const posDiv = document.getElementById('positionFilters');
  DATA.positions.forEach(pos => {
    const chip = document.createElement('button');
    chip.className = 'filter-chip';
    chip.textContent = pos;
    chip.onclick = () => togglePosition(pos, chip);
    posDiv.appendChild(chip);
  });

  const teamDiv = document.getElementById('teamFilters');
  DATA.teams.forEach(team => {
    const chip = document.createElement('button');
    chip.className = 'filter-chip';
    const short = team.replace('Los Angeles ', 'LA ').replace('Golden State ', 'GS ').replace('Oklahoma City ', 'OKC ').replace('Portland Trail Blazers', 'Portland').replace('Minnesota Timberwolves', 'Minnesota').replace('San Antonio ', 'SA ').replace('New Orleans ', 'NO ').replace('New York ', 'NY ').replace('Philadelphia ', 'Philly ').replace('Sacramento ', 'Sac ').replace('Washington ', 'Wash. ').replace('Cleveland ', 'Cle ').replace('Milwaukee ', 'Mil ').replace('Indiana ', 'Ind ');
    chip.textContent = short;
    chip.title = team;
    chip.onclick = () => toggleTeam(team, chip);
    teamDiv.appendChild(chip);
  });

  const draftYears = [...new Set(Object.values(DRAFT_YEAR))].sort((a, b) => b - a);
  const sel = document.getElementById('draftSelect');
  draftYears.forEach(y => {
    const count = DATA.players.filter(p => DRAFT_YEAR[p.n] === y).length;
    if (count === 0) return;
    const opt = document.createElement('option');
    opt.value = y;
    opt.textContent = y + ' (' + count + ')';
    sel.appendChild(opt);
  });
}

function togglePreset(type) {
  const wasActive = activePreset === type;
  clearFilterUI();

  if (wasActive) {
    selectedPlayers.clear();
    resetColors();
    render();
    return;
  }

  activePreset = type;
  jalensActive = type === 'jalens';
  document.getElementById(type === 'jalens' ? 'jalenBtn' : type === 'max' ? 'maxBtn' : type === 'rookies' ? 'rookiesBtn' : 'moversBtn').classList.add('active');

  const lists = { jalens: JALENS, max: DATA.players.filter(p => MAX_PLAYERS.has(p.n)).map(p => p.n), rookies: ROOKIES, movers: MOVERS };
  selectPlayers(lists[type], type === 'max' ? 8 : undefined);
  render();
}

function toggleTier(n, chip) {
  const wasActive = activeTier === n;
  clearFilterUI();

  if (wasActive) {
    selectedPlayers.clear();
    resetColors();
    render();
    return;
  }

  activeTier = n;
  chip.classList.add('active');
  const inTier = DATA.players.filter(p => Math.min(...p.d.map(e => e[1])) <= n)
    .sort((a, b) => Math.min(...a.d.map(e => e[1])) - Math.min(...b.d.map(e => e[1])));
  selectPlayers(inTier.map(p => p.n), 8);
  render();
}

function toggleConference(conf, chip) {
  const wasActive = activeConference === conf;
  clearFilterUI();

  if (wasActive) {
    selectedPlayers.clear();
    resetColors();
    render();
    return;
  }

  activeConference = conf;
  chip.classList.add('active');
  const teams = conf === 'east' ? EAST_TEAMS : WEST_TEAMS;
  const inConf = DATA.players.filter(p => teams.has(p.t))
    .sort((a, b) => Math.min(...a.d.map(e => e[1])) - Math.min(...b.d.map(e => e[1])));
  selectPlayers(inConf.map(p => p.n), 8);
  render();
}

function selectDraftClass(year) {
  clearFilterUI();

  if (!year) {
    selectedPlayers.clear();
    resetColors();
    render();
    return;
  }

  activeDraftClass = parseInt(year);
  document.getElementById('draftSelect').value = year;
  const inClass = DATA.players.filter(p => DRAFT_YEAR[p.n] === activeDraftClass)
    .sort((a, b) => Math.min(...a.d.map(e => e[1])) - Math.min(...b.d.map(e => e[1])));
  selectPlayers(inClass.map(p => p.n), 8);
  render();
}

function togglePosition(pos, chip) {
  const wasActive = activePosition === pos;
  clearFilterUI();

  if (wasActive) {
    selectedPlayers.clear();
    resetColors();
    render();
    return;
  }

  activePosition = pos;
  chip.classList.add('active');
  applyFilters();
}

function toggleTeam(team, chip) {
  const wasActive = activeTeam === team;
  clearFilterUI();

  if (wasActive) {
    selectedPlayers.clear();
    resetColors();
    render();
    return;
  }

  activeTeam = team;
  chip.classList.add('active');
  applyFilters();
}

function applyFilters() {
  selectedPlayers.clear();
  resetColors();
  let filtered = DATA.players;
  if (activePosition) {
    const posMap = { 'Big': ['Big','Center'], 'Center': ['Big','Center'], 'Guard': ['Guard'], 'Forward': ['Forward'] };
    const validPos = posMap[activePosition] || [activePosition];
    filtered = filtered.filter(p => validPos.includes(p.p));
  }
  if (activeTeam) filtered = filtered.filter(p => p.t === activeTeam);
  const withBest = filtered.map(p => {
    const bestRank = Math.min(...p.d.map(d => d[1]));
    return { ...p, bestRank };
  }).sort((a, b) => a.bestRank - b.bestRank);
  withBest.slice(0, 8).forEach(p => { selectedPlayers.add(p.n); assignColor(p.n); });
  render();
}

function addPlayer(name) {
  if (selectedPlayers.size >= 8 && !selectedPlayers.has(name)) return;
  clearFilterUI();
  selectedPlayers.add(name);
  assignColor(name);
  render();
}

function removePlayer(name) {
  selectedPlayers.delete(name);
  clearFilterUI();
  render();
}

function clearAll() {
  selectedPlayers.clear();
  resetColors();
  clearFilterUI();
  render();
}

function onSearch(query) {
  const results = document.getElementById('searchResults');
  if (!query || query.length < 2) { results.innerHTML = ''; return; }
  const q = query.toLowerCase();
  const matches = DATA.players
    .filter(p => p.n.toLowerCase().includes(q))
    .sort((a, b) => {
      const aStarts = a.n.toLowerCase().startsWith(q) ? 0 : 1;
      const bStarts = b.n.toLowerCase().startsWith(q) ? 0 : 1;
      return aStarts - bStarts || a.n.localeCompare(b.n);
    })
    .slice(0, 12);

  results.innerHTML = '';
  matches.forEach(p => {
    const div = document.createElement('div');
    div.className = 'search-item';
    const nameSpan = document.createElement('span');
    nameSpan.textContent = p.n;
    const posSpan = document.createElement('span');
    posSpan.className = 'pos';
    posSpan.textContent = p.p;
    div.appendChild(nameSpan);
    div.appendChild(posSpan);
    div.onclick = () => {
      addPlayer(p.n);
      document.getElementById('searchInput').value = '';
      results.innerHTML = '';
    };
    results.appendChild(div);
  });
}

    document.getElementById('chartTitle').textContent = 'Max Contract Players';
  } else if (activePreset === 'rookies') {
    document.getElementById('chartTitle').textContent = LATEST_SEASON + ' Rookies';
  } else if (activePreset === 'movers') {
    document.getElementById('chartTitle').textContent = 'Biggest Movers';
  } else if (activeTier) {
    document.getElementById('chartTitle').textContent = 'Ever Ranked Top ' + activeTier;
  } else if (activeConference) {
    document.getElementById('chartTitle').textContent = (activeConference === 'east' ? 'Eastern' : 'Western') + ' Conference';
  } else if (activeDraftClass) {
    document.getElementById('chartTitle').textContent = activeDraftClass + ' Draft Class';
  } else if (activeTeam) {
    document.getElementById('chartTitle').textContent = activeTeam;
  } else if (activePosition) {
    document.getElementById('chartTitle').textContent = 'Top ' + activePosition + 's';
  } else {
    const names = [...selectedPlayers];
    document.getElementById('chartTitle').textContent = names.length <= 3 ? names.join(' vs ') : names.length + ' players';
  }

  drawChart();
  renderTable();
}

function renderSelectedTags() {
  const container = document.getElementById('selectedPlayers');
  const clearBtn = document.getElementById('clearBtn');
  if (selectedPlayers.size === 0) {
    container.innerHTML = '<div style="font-size:12px;color:var(--text-muted)">Showing all players — select or filter to focus</div>';
    clearBtn.style.display = 'none';
    return;
  }
  clearBtn.style.display = '';
  container.innerHTML = '';
  [...selectedPlayers].forEach(name => {
    const tag = document.createElement('div');
    tag.className = 'selected-tag';
    const swatch = document.createElement('span');
    swatch.className = 'swatch';
    swatch.style.background = assignColor(name);
    const nameSpan = document.createElement('span');
    nameSpan.textContent = name;
    const remove = document.createElement('span');
    remove.className = 'remove';
    remove.textContent = '×';
    remove.onclick = () => removePlayer(name);
    tag.appendChild(swatch);
    tag.appendChild(nameSpan);
    tag.appendChild(remove);
    container.appendChild(tag);
  });
}

function drawChart() {
  const svg = document.getElementById('chartSvg');
  const rect = svg.parentElement.getBoundingClientRect();
  const W = rect.width;
  const H = rect.height;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  const margin = { top: 24, right: 100, bottom: 36, left: 44 };
  const plotW = W - margin.left - margin.right;
  const plotH = H - margin.top - margin.bottom;

  const dates = DATA.dates;
  const overviewMode = selectedPlayers.size === 0;
  const players = overviewMode ? DATA.players : DATA.players.filter(p => selectedPlayers.has(p.n));

  // Determine rank range
  let maxRank = overviewMode ? 100 : 100;
  players.forEach(p => {
    p.d.forEach(([di, r]) => { if (r > maxRank) maxRank = r; });
  });
  maxRank = Math.min(maxRank + 5, 133);

  const xScale = (di) => margin.left + (di / (dates.length - 1)) * plotW;
  const yScale = (rank) => margin.top + ((rank - 1) / (maxRank - 1)) * plotH;

  let html = '';

  // Gridlines
  const gridRanks = [];
  const step = maxRank <= 30 ? 5 : maxRank <= 60 ? 10 : 20;
  for (let r = 1; r <= maxRank; r += step) gridRanks.push(r);
  if (!gridRanks.includes(1)) gridRanks.unshift(1);

  gridRanks.forEach(r => {
    const y = yScale(r);
    html += `<line x1="${margin.left}" y1="${y}" x2="${W - margin.right}" y2="${y}" stroke="var(--gridline)" stroke-width="1"/>`;
    html += `<text x="${margin.left - 8}" y="${y}" fill="var(--text-muted)" font-size="11" text-anchor="end" dominant-baseline="middle" font-variant-numeric="tabular-nums">#${r}</text>`;
  });

  // Season dividers
  const seasonStarts = {};
  dates.forEach((d, i) => {
    const [y, m] = d.split('-').map(Number);
    const season = m >= 10 ? `${y}-${String(y+1).slice(-2)}` : `${y-1}-${String(y).slice(-2)}`;
    if (!seasonStarts[season]) seasonStarts[season] = i;
  });
  Object.entries(seasonStarts).forEach(([season, di]) => {
    if (di === 0) return;
    const x = xScale(di);
    html += `<line x1="${x}" y1="${margin.top}" x2="${x}" y2="${H - margin.bottom}" stroke="var(--border)" stroke-width="1" stroke-dasharray="none"/>`;
  });

  // X-axis labels (seasons)
  Object.entries(seasonStarts).forEach(([season, startDi]) => {
    const endDi = Object.values(seasonStarts).find(v => v > startDi) ?? dates.length - 1;
    const midDi = (startDi + Math.min(endDi, dates.length - 1)) / 2;
    const x = xScale(midDi);
    html += `<text x="${x}" y="${H - margin.bottom + 22}" fill="var(--text-secondary)" font-size="12" text-anchor="middle" font-weight="600">${season}</text>`;
  });

  // Baseline
  html += `<line x1="${margin.left}" y1="${H - margin.bottom}" x2="${W - margin.right}" y2="${H - margin.bottom}" stroke="var(--baseline)" stroke-width="1"/>`;

  // Lines and dots for each player
  const endLabels = [];
  players.forEach(player => {
    const color = overviewMode ? 'var(--deemph)' : assignColor(player.n);
    const points = player.d.filter(([di]) => di >= 0 && di < dates.length);
    if (points.length === 0) return;

    if (points.length >= 2) {
      const pathParts = points.map(([di, r], i) => `${i === 0 ? 'M' : 'L'}${xScale(di).toFixed(1)},${yScale(r).toFixed(1)}`);
      html += `<path d="${pathParts.join(' ')}" fill="none" stroke="${color}" stroke-width="${overviewMode ? 1 : 2}" stroke-linecap="round" stroke-linejoin="round" opacity="${overviewMode ? 0.4 : 1}"/>`;
    }

    if (!overviewMode) {
      const last = points[points.length - 1];
      const lx = xScale(last[0]);
      const ly = yScale(last[1]);
      html += `<circle cx="${lx}" cy="${ly}" r="5" fill="var(--surface-chart)" stroke="none"/>`;
      html += `<circle cx="${lx}" cy="${ly}" r="4" fill="${color}" stroke="none"/>`;
      endLabels.push({ x: lx, y: ly, name: player.n, color });
    }
  });

  if (!overviewMode) {
    endLabels.sort((a, b) => a.y - b.y);
    const labelH = 13;
    for (let i = 1; i < endLabels.length; i++) {
      const prev = endLabels[i - 1];
      const curr = endLabels[i];
      if (curr.y - prev.y < labelH) {
        curr.y = prev.y + labelH;
      }
    }
    endLabels.forEach(lbl => {
      html += `<text x="${lbl.x + 8}" y="${lbl.y}" fill="var(--text-secondary)" font-size="11" dominant-baseline="middle" font-weight="500">${lbl.name}</text>`;
    });
  }

  // Invisible hover columns for tooltip
  dates.forEach((d, di) => {
    const x = xScale(di);
    const colW = plotW / dates.length;
    html += `<rect x="${x - colW/2}" y="${margin.top}" width="${colW}" height="${plotH}" fill="transparent" data-di="${di}" class="hover-col"/>`;
  });

  // Crosshair
  html += `<line id="crosshair" x1="0" y1="${margin.top}" x2="0" y2="${H - margin.bottom}" stroke="var(--baseline)" stroke-width="1" style="display:none"/>`;

  svg.innerHTML = html;

  // Tooltip events
  const tooltip = document.getElementById('tooltip');
  const crosshair = document.getElementById('crosshair');
  svg.querySelectorAll('.hover-col').forEach(col => {
    col.addEventListener('pointermove', (e) => {
      const di = parseInt(col.dataset.di);
      const x = xScale(di);
      crosshair.setAttribute('x1', x);
      crosshair.setAttribute('x2', x);
      crosshair.style.display = '';

      const dateStr = formatDate(dates[di]);
      const allAtDate = [];
      players.forEach(p => {
        const point = p.d.find(([pdi]) => pdi === di);
        if (point) {
          allAtDate.push({ name: p.n, rank: point[1], color: overviewMode ? 'var(--text-secondary)' : assignColor(p.n) });
        }
      });
      allAtDate.sort((a, b) => a.rank - b.rank);

      let rows;
      if (overviewMode) {
        const svgRect = svg.getBoundingClientRect();
        const mouseY = e.clientY - svgRect.top;
        const hoverRank = 1 + ((mouseY - margin.top) / plotH) * (maxRank - 1);
        const nearby = allAtDate.filter(r => Math.abs(r.rank - hoverRank) <= 3).slice(0, 5);
        rows = nearby.length > 0 ? nearby : allAtDate.slice(0, 5);
      } else {
        rows = allAtDate;
      }

      if (rows.length === 0) { tooltip.classList.remove('visible'); return; }

      const link = ringerLink(dates[di]);
      document.getElementById('tooltipDate').innerHTML = `<a href="${link}" target="_blank" rel="noopener">${dateStr} ↗</a>`;
      const filterLabel = getFilterLabel();
      const rowsHtml = rows.map((r, ri) => `
        <div class="tooltip-row">
          <span class="tooltip-swatch" style="background:${r.color}"></span>
          <span class="tooltip-name">${escapeHtml(r.name)}</span>
          <span class="tooltip-rank">#${r.rank}${filterLabel ? `<span class="tooltip-filter-rank">(#${ri + 1})</span>` : ''}</span>
        </div>
      `).join('');
      document.getElementById('tooltipRows').innerHTML = rowsHtml;

      const tx = e.clientX + 16;
      const ty = e.clientY - 20;
      const tw = tooltip.offsetWidth;
      const th = tooltip.offsetHeight;
      tooltip.style.left = (tx + tw > window.innerWidth ? e.clientX - tw - 16 : tx) + 'px';
      tooltip.style.top = Math.max(8, Math.min(ty, window.innerHeight - th - 8)) + 'px';
      tooltip.classList.add('visible');
    });
  });

  let hideTimeout;
  function scheduleHide() {
    hideTimeout = setTimeout(() => {
      crosshair.style.display = 'none';
      tooltip.classList.remove('visible');
    }, 120);
  }
  svg.addEventListener('pointerleave', scheduleHide);
  tooltip.addEventListener('pointerenter', () => clearTimeout(hideTimeout));
  tooltip.addEventListener('pointerleave', scheduleHide);
}

function renderTable() {
  const tv = document.getElementById('tableView');
  if (selectedPlayers.size === 0) { tv.innerHTML = ''; return; }

  const players = DATA.players.filter(p => selectedPlayers.has(p.n));
  const dates = DATA.dates;

  // Get all dates where at least one selected player has data
  const activeDateIdxs = new Set();
  players.forEach(p => p.d.forEach(([di]) => activeDateIdxs.add(di)));
  const sortedDates = [...activeDateIdxs].sort((a, b) => a - b);

  let html = '<table><thead><tr><th>Player</th><th>Pos</th><th>Team</th>';
  sortedDates.forEach(di => {
    html += `<th>${formatDateShort(dates[di])}</th>`;
  });
  html += '</tr></thead><tbody>';

  players.sort((a, b) => {
    const aLast = a.d[a.d.length - 1]?.[1] ?? 999;
    const bLast = b.d[b.d.length - 1]?.[1] ?? 999;
    return aLast - bLast;
  }).forEach(p => {
    const rankMap = new Map(p.d);
    html += `<tr><td><strong>${escapeHtml(p.n)}</strong></td><td>${escapeHtml(p.p)}</td><td>${escapeHtml(p.t)}</td>`;
    sortedDates.forEach(di => {
      const rank = rankMap.get(di);
      html += `<td>${rank != null ? '#' + rank : ''}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  tv.innerHTML = html;
}

function toggleTable() {
  showingTable = !showingTable;
  const btn = document.getElementById('tableToggle');
  const chartArea = document.getElementById('chartArea');
  const tableView = document.getElementById('tableView');
  if (showingTable) {
    chartArea.style.display = 'none';
    tableView.classList.add('visible');
    btn.textContent = 'Chart view';
  } else {
    chartArea.style.display = '';
    tableView.classList.remove('visible');
    btn.textContent = 'Table view';
  }
}

function formatDate(d) {
  const [y, m, day] = d.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[parseInt(m)-1]} ${parseInt(day)}, ${y}`;
}

function formatDateShort(d) {
  const [y, m] = d.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[parseInt(m)-1]} '${y.slice(-2)}`;
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

window.addEventListener('resize', () => {
  if (selectedPlayers.size > 0 && !showingTable) drawChart();
});

init();
render();
</script>
